<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/config.js"></script>
  <script src="/script.js" defer></script>

  <title data-wedding-title>{couple} | FAQ</title>
  <meta name="description" content="よくある質問" />
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">
      <div class="title" data-wedding-couple></div>
      <div class="sub"><span data-wedding-text="dateLabel"></span> <span data-wedding-text="dayLabel"></span></div>
    </a>
    <div class="nav">
      <a href="/" >トップ</a>
      <a href="/schedule/" >当日スケジュール</a>
      <a href="/access/" >アクセス</a>
      <a href="/faq/" aria-current="page">FAQ</a>
      <a href="/rsvp/" >出欠回答</a>
    </div>
  </div>

  <div class="container">
    <section class="hero">
      <div class="kicker"><span class="dot"></span> FAQ</div>
      <h1 class="h1">よくある質問</h1>
      <p class="lede">事前に分かりそうな点をまとめています。追加したい場合は <code class="inline">config.js</code> の <code class="inline">faqs</code> を編集してください。</p>
    </section>

    <section class="grid">
      <div class="card">
        <h2>FAQ</h2>
        <div data-wedding-faq></div>
      </div>

      <div class="card">
        <h2>個別のご相談</h2>
        <div class="meta">
          <div>ご不明点はお気軽にご連絡ください。</div>
          <div class="small">E-mail：<b data-wedding-text="contact.email"></b></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div>© <span data-wedding-couple></span></div>
      <div><a href="/">トップへ</a></div>
    </footer>
  </div>
</body>
</html>
