<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#124C3E" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/config.js"></script>
  <script src="/script.js" defer></script>

  <title data-wedding-title>{couple} | FAQ</title>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <div class="title" data-wedding-couple></div>
        <div class="sub"><span data-wedding-text="dateLabel"></span> <span data-wedding-text="dayLabel"></span></div>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">トップ</a>
        <a href="/schedule/">当日スケジュール</a>
        <a href="/access/">アクセス</a>
        <a href="/faq/">FAQ</a>
        <a href="/rsvp/">招待状</a>
      </nav>
    </div>
  </div>

  <main class="container">
    <section class="hero">
      <div class="kicker"><span class="dot"></span> FAQ</div>
      <h1 class="h1">FAQ</h1>
      <p class="lede">よくあるご質問をまとめています。必要に応じて <code class="inline">config.js</code> の <code class="inline">faqs</code> を編集してください。</p>
    </section>

    <section class="grid">
      <div class="card">
        <h2>Q & A</h2>
        <div class="meta" data-wedding-faq></div>
      </div>
    </section>

    <footer class="footer">
      <div>© <span data-wedding-text="copyright"></span></div>
      <div><a class="btn" href="/">トップへ</a></div>
    </footer>
  </main>
</body>
</html>
