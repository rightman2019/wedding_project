<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#124C3E" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/config.js" defer></script>
  <script src="/script.js" defer></script>
  <title data-wedding-title>席次表 | {couple}</title>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Home">
        <span class="mark" aria-hidden="true">W</span>
        <span class="brand-text" data-wedding-couple></span>
      </a>

      <button class="menu-btn" type="button" id="menu-toggle" aria-expanded="false" aria-controls="site-nav">
        <img src="/assets/icons/menu.svg" alt="" aria-hidden="true">
        <span class="sr-only">メニュー</span>
      </button>

      <nav class="nav" id="site-nav" aria-label="Site">
        <a href="/"><img class="nav-ico" src="/assets/icons/home.svg" alt="" aria-hidden="true"><span>トップ</span></a>
        <a href="/schedule/"><img class="nav-ico" src="/assets/icons/clock.svg" alt="" aria-hidden="true"><span>当日スケジュール</span></a>
        <a href="/access/"><img class="nav-ico" src="/assets/icons/pin.svg" alt="" aria-hidden="true"><span>アクセス</span></a>
        <a href="/seating/"><img class="nav-ico" src="/assets/icons/table.svg" alt="" aria-hidden="true"><span>席次表</span></a>
        <a href="/faq/"><img class="nav-ico" src="/assets/icons/faq.svg" alt="" aria-hidden="true"><span>FAQ</span></a>
        <a href="/menu/"><img class="nav-ico img" src="/assets/icons/isle-of-islay-distillery-map.png" alt="" aria-hidden="true"><span>メニュー</span></a>
        <a href="https://tetris-6r8.pages.dev/" target="_blank" rel="noopener"><img class="nav-ico" src="/assets/icons/external.svg" alt="" aria-hidden="true"><span>テトリス</span></a>
        <a href="/rsvp/"><img class="nav-ico" src="/assets/icons/invite.svg" alt="" aria-hidden="true"><span>招待状</span></a>
      </nav>
    </div>
  </div>

  <main class="container">
    <section class="hero">
      <div class="kicker"><span class="dot"></span> Seating</div>
      <h1 class="h1">席次表</h1>
      <p class="lede">丸テーブル（6席）</p>
      <p class="small" data-wedding-text="seating.note"></p>
    </section>

    <section class="grid">
      <div class="card">
        <h2><img class="ico" src="/assets/icons/table.svg" alt="" aria-hidden="true"><span data-wedding-text="seating.tableLabel"></span></h2>
        <div data-wedding-seatmap></div>
        <div class="small" style="margin-top:10px; opacity:.85">※氏名の表示は設定ファイル（config.js）の席次表セクションを編集するだけで更新できます。</div>
      </div>
    </section>

    <footer class="footer">
      <div><span class="copy-mark">©</span> <span data-wedding-text="copyright"></span></div>
      <div><a class="btn" href="/">トップへ</a></div>
    </footer>
  </main>
</body>
</html>
