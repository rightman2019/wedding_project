<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#124C3E" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
  <title data-wedding-title>{couple} | メニュー</title>
  <script defer src="/config.js"></script>
  <script defer src="/script.js"></script>
</head>
<body>
  <div class="obi left" data-obi aria-hidden="true"></div>
  <div class="obi right" data-obi aria-hidden="true"></div>

  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <div class="title" data-wedding-couple></div>
        <div class="sub"><span data-wedding-text="dateLabel"></span> <span data-wedding-text="dayLabel"></span></div>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/"><img class="nav-ico" src="/assets/icons/home.svg" alt="" aria-hidden="true"><span>トップ</span></a>
        <a href="/schedule/"><img class="nav-ico" src="/assets/icons/clock.svg" alt="" aria-hidden="true"><span>当日スケジュール</span></a>
        <a href="/access/"><img class="nav-ico" src="/assets/icons/pin.svg" alt="" aria-hidden="true"><span>アクセス</span></a>
        <a href="/faq/"><img class="nav-ico" src="/assets/icons/faq.svg" alt="" aria-hidden="true"><span>FAQ</span></a>
        <a href="/menu/"><img class="nav-ico img" src="/assets/icons/isle-of-islay-distillery-map.webp" alt="" aria-hidden="true"><span>メニュー</span></a>
        <a href="/rsvp/"><img class="nav-ico" src="/assets/icons/invite.svg" alt="" aria-hidden="true"><span>招待状</span></a>
      </nav>
    </div>
  </div>

  <main class="wrap">
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-badge">SPECIAL MENU</div>
        <h1 class="h1">メニュー</h1>
        <p class="lead">当日のスペシャルメニューです。<br/>PDFを開くか、プレビュー画像からご覧ください。</p>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2><img class="ico img" src="/assets/icons/isle-of-islay-distillery-map.webp" alt="" aria-hidden="true"><span>SPECIAL MENU</span></h2>

        <div class="actions" style="margin-top:12px">
          <a class="btn primary" href="/assets/menu/SPECIAL_MENU.pdf" target="_blank" rel="noopener">
            <img class="icon" src="/assets/icons/external.svg" alt="" aria-hidden="true"> PDFを開く
          </a>
          <a class="btn" href="/assets/menu/SPECIAL_MENU.pdf" download>
            <img class="icon" src="/assets/icons/menu.svg" alt="" aria-hidden="true"> ダウンロード
          </a>
        </div>

        <div class="menu-preview" style="margin-top:16px">
          <a href="/assets/menu/SPECIAL_MENU.pdf" target="_blank" rel="noopener" class="menu-preview-link" aria-label="SPECIAL MENU (PDF) を開く">
            <img src="/assets/menu/SPECIAL_MENU.png" alt="SPECIAL MENU プレビュー" loading="lazy" />
          </a>
        </div>

        <div class="small" style="margin-top:12px">
          ※ブラウザによってはPDFの埋め込み表示ができない場合があります。上のボタンから開いてください。
        </div>
      </div>
    </section>

    <footer class="footer">
      <div>© <span data-wedding-text="copyright"></span></div>
      <div><a class="btn" href="/">トップへ</a></div>
    </footer>
  </main>
</body>
</html>
