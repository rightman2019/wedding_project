<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#124C3E" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/config.js"></script>
  <script src="/script.js" defer></script>

  <title data-wedding-title>{couple} | Invitation</title>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <div class="title" data-wedding-couple></div>
        <div class="sub"><span data-wedding-text="dateLabel"></span> <span data-wedding-text="dayLabel"></span></div>
      </a>
      <nav class="nav" aria-label="Site">
        <a href="/">トップ</a>
        <a href="/schedule/">当日スケジュール</a>
        <a href="/access/">アクセス</a>
        <a href="/faq/">FAQ</a>
        <a href="/rsvp/">招待状</a>
      </nav>
    </div>
  </div>

  <main class="container">
    <section class="hero">
      <div class="kicker"><span class="dot"></span> Invitation</div>
      <h1 class="h1">招待状</h1>
      <p class="lede">当日の詳細は、招待状サイトをご確認ください。</p>
      <div class="actions">
        <a class="btn primary" data-wedding-href="invitation.url" href="#"><span class="icon">✉</span> 招待状サイトへ</a>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>招待状サイト</h2>
        <div class="meta">
          <div><b data-wedding-text="invitation.url"></b></div>
          <div class="small" data-wedding-text="invitation.note"></div>
        </div>
      </div>

      <div class="card">
        <h2>連絡先</h2>
        <div class="meta">
          <div data-wedding-text="contact.name"></div>
          <div class="small"><span data-wedding-text="contact.email"></span></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div>© <span data-wedding-text="copyright"></span></div>
      <div><a class="btn" href="/">トップへ</a></div>
    </footer>
  </main>
</body>
</html>
