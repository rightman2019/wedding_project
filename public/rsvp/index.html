<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#124C3E" />
  <link rel="icon" href="/favicon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/config.js"></script>
  <script src="/script.js" defer></script>

  <title data-wedding-title>{couple} | Invitation</title>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <div class="title" data-wedding-couple></div>
        <div class="sub"><span data-wedding-text="dateLabel"></span> <span data-wedding-text="dayLabel"></span></div>
      </a>
      <button class="nav-toggle" type="button" aria-label="メニュー" aria-controls="site-nav" aria-expanded="false">
        <span class="nav-toggle-icon" aria-hidden="true"></span>
      </button>
      <nav class="nav" id="site-nav" aria-label="Site">
        <a href="/"><img class="nav-ico" src="/assets/icons/home.svg" alt="" aria-hidden="true"><span>トップ</span></a>
        <a class="nav-upload" data-wedding-href="upload.url" href="https://forms.gle/pNEyc2uor9dgVPmQ8" target="_blank" rel="noopener"><img class="nav-ico" src="/assets/icons/external.svg" alt="" aria-hidden="true"><span>アップロード</span></a>
        <a href="/schedule/"><img class="nav-ico" src="/assets/icons/clock.svg" alt="" aria-hidden="true"><span>当日スケジュール</span></a>
        <a href="/access/"><img class="nav-ico" src="/assets/icons/pin.svg" alt="" aria-hidden="true"><span>アクセス</span></a>
        <a href="/faq/"><img class="nav-ico" src="/assets/icons/faq.svg" alt="" aria-hidden="true"><span>FAQ</span></a>
        <a href="/menu/"><img class="nav-ico img" src="/assets/icons/isle-of-islay-distillery-map.png" alt="" aria-hidden="true"><span>メニュー</span></a>
        <a href="/rsvp/"><img class="nav-ico" src="/assets/icons/invite.svg" alt="" aria-hidden="true"><span>招待状</span></a>
      </nav>
    </div>
  </div>

  <main class="container">
    <section class="hero">
      <div class="kicker"><span class="dot"></span> Invitation</div>
      <h1 class="h1">招待状</h1>
      <p class="lede">当日の詳細は、招待状サイトをご確認ください。</p>
      <div class="actions">
        <a class="btn primary" data-wedding-href="rsvp.url" href="#"><img class="icon" src="/assets/icons/invite.svg" alt="" aria-hidden="true"> 招待状サイトへ</a>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>招待状サイト</h2>
        <div class="meta">
          <div><b data-wedding-text="rsvp.url"></b></div>
          <div class="small" data-wedding-text="rsvp.note"></div>
        </div>
      </div>

      <div class="card">
        <h2>連絡先</h2>
        <div class="meta">
          <div data-wedding-text="contact.name"></div>
          <div class="small"><span data-wedding-text="contact.email"></span></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div><span class="copy-mark">©</span> <span data-wedding-text="copyright"></span></div>
      <div><a class="btn" href="/">トップへ</a></div>
    </footer>
  </main>
</body>
</html>
